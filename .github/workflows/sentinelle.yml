          --issue $RUNNER_TEMP/issue-successioni.md --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/sentinelle.md
      - name: pubblica
        if: always() && env.SCRIVE == 'true'
        run: |
          python3 scripts/sentinelle_pubblica.py --aggiungi successioni
          git commit -m "sentinelle successioni $(date -u +%F)" || echo "nessuna modifica"
          for tentativo in 1 2 3; do
