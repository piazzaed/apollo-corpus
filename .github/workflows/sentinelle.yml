            Alla fine scrivi gli esiti in ${{ runner.temp }}/esiti-modelli.json.
          claude_args: >-
            --model opus
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(python3 scripts/codice_locale.py:*),Bash(python3 scripts/sentinella_modelli.py:*)"
      - name: controllo meccanico
        id: controllo
        if: always()
        run: >-
          python3 scripts/sentinelle_giro.py --area modelli --fase dopo-claude --triage $RUNNER_TEMP/triage-modelli.json
