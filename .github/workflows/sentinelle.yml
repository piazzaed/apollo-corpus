          echo "STUDIO_STATO_PERSISTENTE=$RUNNER_TEMP/persistente" >> "$GITHUB_ENV"
          echo "FONTI_CACHE=$RUNNER_TEMP/fonti-cache" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || echo "pdftotext non installato"
      - name: passi senza Claude
        id: det
        run: >-
          python3 scripts/sentinelle_giro.py --area normativa --fase deterministica --triage $RUNNER_TEMP/triage-normativa.json
          --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/sentinelle.md
      - name: passi senza Claude fissati (commit locale, cosi' il controllo vede solo le modifiche di Claude)
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          python3 scripts/sentinelle_pubblica.py --aggiungi normativa
          git commit -m "sentinelle normativa: passi senza Claude $(date -u +%F)" || echo "nessuna modifica"
      - name: Claude
        id: claude
        if: steps.det.outputs.claude == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBAGENT_MODEL: opus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Segui le istruzioni di .github/claude/sentinella-normativa.md.
            Il lavoro da fare e' in ${{ runner.temp }}/triage-normativa.json.
            Alla fine scrivi gli esiti in ${{ runner.temp }}/esiti-normativa.json.
          claude_args: >-
            --model opus
            --allowedTools "Read,Glob,Grep,Write,WebFetch,WebSearch,Bash(python3 scripts/sentinelle_prove.py:*),Bash(python3 scripts/codice_locale.py:*),Bash(python3 scripts/cassazione_indice.py:*)"
      - name: controllo meccanico
        id: controllo
        if: always()
        run: >-
          python3 scripts/sentinelle_giro.py --area normativa --fase dopo-claude --triage $RUNNER_TEMP/triage-normativa.json
          --esiti $RUNNER_TEMP/esiti-normativa.json --claude-ok ${{ steps.claude.outcome != 'failure' }}
          --issue $RUNNER_TEMP/issue-normativa.md --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/sentinelle.md
      - name: pubblica
        if: always() && env.SCRIVE == 'true'
        run: |
          python3 scripts/sentinelle_pubblica.py --aggiungi normativa
          git commit -m "sentinelle normativa $(date -u +%F)" || echo "nessuna modifica"
          for tentativo in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort; sleep 15; continue; }
            python3 scripts/sentinelle_pubblica.py --manifest && python3 scripts/sentinelle_pubblica.py --verifica || exit 1
            git add -- wiki-studio/sentinelle/manifest.json
            git commit -m "sentinelle: manifest $(date -u +%F)" || echo "manifest invariato"
            git push && exit 0
            sleep 15
          done
          exit 1
      - name: segnalazione
        if: always() && env.SCRIVE == 'true' && steps.controllo.outputs.problemi != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sentinelle --color FBCA04 --description "da ricontrollare (sentinelle automatiche)" --force || true
          gh label create memento --color 0E8A16 --description "schede del memento da rivedere" --force || true
          gh issue create --title "sentinelle normativa: da ricontrollare ($(date -u +%F))" --label sentinelle --body-file $RUNNER_TEMP/issue-normativa.md || true
      - name: rapporto
        if: always()
