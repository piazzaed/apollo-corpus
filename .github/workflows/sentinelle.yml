name: sentinelle

# Sentinelle automatiche: dati periodici, riforme della watchlist, successioni, modelli d'atto (vedi SENTINELLE.md).
# Scrivono nel repo solo le aree elencate nella variabile del repo SENTINELLE_AREE_SCRITTURA (es. "dati normativa"):
# finché un'area non c'è, il giro è «a secco» (rapporto nel riepilogo, nessun push, nessuna issue).

on:
  workflow_run:
    workflows: ["lavoro (CCNL, prassi, memento)"]
    types: [completed]
  schedule:
    - cron: "33 3 * * 3"          # mercoledì 05:33 ora italiana: riserva se la catena del lunedì non è partita
  workflow_dispatch:
    inputs:
      area:
        description: "area da far girare"
        type: choice
        options: ["tutte", "dati", "normativa", "successioni", "modelli"]
        default: "tutte"
      a_secco:
        description: "solo rapporto: nessuna scrittura nel repo, nessuna issue"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: corpus
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.area == 'tutte' || inputs.area == 'dati') }}
    env:
      SCRIVE: ${{ contains(vars.SENTINELLE_AREE_SCRITTURA, 'dati') && !(github.event_name == 'workflow_dispatch' && inputs.a_secco) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: cartelle di lavoro fuori dal repo
        run: |
          echo "STUDIO_STATO_ROOT=$RUNNER_TEMP/stato" >> "$GITHUB_ENV"
          echo "STUDIO_CORPUS=$RUNNER_TEMP/corpus-vivo" >> "$GITHUB_ENV"
          echo "STUDIO_STATO_PERSISTENTE=$RUNNER_TEMP/persistente" >> "$GITHUB_ENV"
          echo "FONTI_CACHE=$RUNNER_TEMP/fonti-cache" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || echo "pdftotext non installato"
      - name: passi senza Claude
        id: det
        run: >-
          python3 scripts/sentinelle_giro.py --area dati --fase deterministica --triage $RUNNER_TEMP/triage-dati.json
          --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/sentinelle.md
      - name: passi senza Claude fissati (commit locale, cosi' il controllo vede solo le modifiche di Claude)
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          python3 scripts/sentinelle_pubblica.py --aggiungi dati
          git commit -m "sentinelle dati: passi senza Claude $(date -u +%F)" || echo "nessuna modifica"
      - name: Claude
        id: claude
        if: steps.det.outputs.claude == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBAGENT_MODEL: opus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Segui le istruzioni di .github/claude/sentinella-dati.md.
            Il lavoro da fare e' in ${{ runner.temp }}/triage-dati.json.
            Alla fine scrivi gli esiti in ${{ runner.temp }}/esiti-dati.json.
          claude_args: >-
            --model opus
            --allowedTools "Read,Glob,Grep,Write,WebFetch,WebSearch,Bash(python3 scripts/sentinelle_prove.py:*),Bash(python3 -m json.tool:*),Bash(git status:*),Bash(git diff:*)"
      - name: controllo meccanico
        id: controllo
        if: always()
        run: >-
          python3 scripts/sentinelle_giro.py --area dati --fase dopo-claude --triage $RUNNER_TEMP/triage-dati.json
          --esiti $RUNNER_TEMP/esiti-dati.json --claude-ok ${{ steps.claude.outcome != 'failure' }}
          --issue $RUNNER_TEMP/issue-dati.md --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/sentinelle.md
      - name: cosa pubblicherebbe il giro (diff, per rivederlo)
        if: always()
        run: |
          git diff origin/main -- . > $RUNNER_TEMP/diff-dati.patch || true
          git ls-files --others --exclude-standard | while read -r f; do git diff --no-index -- /dev/null "$f" || true; done >> $RUNNER_TEMP/diff-dati.patch
      - name: pubblica
        if: always() && env.SCRIVE == 'true'
        run: python3 scripts/sentinelle_pubblica.py --pubblica dati
      - name: segnalazione
        if: always() && env.SCRIVE == 'true' && steps.controllo.outputs.problemi != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create sentinelle --color FBCA04 --description "da ricontrollare (sentinelle automatiche)" --force || true
          gh label create memento --color 0E8A16 --description "schede del memento da rivedere" --force || true
          gh issue create --title "sentinelle dati: da ricontrollare ($(date -u +%F))" --label sentinelle --body-file $RUNNER_TEMP/issue-dati.md || true
      - name: rapporto
        if: always()
        run: |
          echo "scritture: ${{ env.SCRIVE }}" | tee -a $GITHUB_STEP_SUMMARY
          cat $RUNNER_TEMP/sentinelle.md 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY || true
          cat $RUNNER_TEMP/issue-dati.md 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY || true
          git diff --stat origin/main -- . 2>/dev/null | tail -15 || true
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); r=([m for m in d if m.get('type')=='result'] or [dict()])[-1]; print('Claude:', r.get('num_turns'), 'passi.', str(r.get('result') or '')[:3000]); [print('::warning::permesso negato a Claude:', x.get('tool_name'), json.dumps(x.get('tool_input'), ensure_ascii=False)[:200]) for x in r.get('permission_denials') or []]" $RUNNER_TEMP/claude-execution-output.json 2>/dev/null || true
          grep -h -E "❌|⚠️|non verificat|respint|interrott" $RUNNER_TEMP/sentinelle.md $RUNNER_TEMP/issue-dati.md 2>/dev/null | head -20 | sed 's/^- */::warning::/' || true
      - name: file del giro (triage, esiti, segnalazioni, diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelle-dati
          path: |
            ${{ runner.temp }}/triage-dati.json
            ${{ runner.temp }}/triage-dati.giro.json
            ${{ runner.temp }}/esiti-dati.json
            ${{ runner.temp }}/issue-dati.md
            ${{ runner.temp }}/sentinelle.md
            ${{ runner.temp }}/diff-dati.patch
          retention-days: 14
          if-no-files-found: ignore

