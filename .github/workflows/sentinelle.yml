          echo "STUDIO_CORPUS=$RUNNER_TEMP/corpus-vivo" >> "$GITHUB_ENV"
          echo "STUDIO_STATO_PERSISTENTE=$RUNNER_TEMP/persistente" >> "$GITHUB_ENV"
          echo "FONTI_CACHE=$RUNNER_TEMP/fonti-cache" >> "$GITHUB_ENV"
