name: corpus settimanale

on:
  schedule:
    - cron: "17 2 * * 1"          # lunedi' 04:17 ora italiana (02:17 UTC)
  push:                           # v0.36: un plugin ha aggiunto atti al corpus: si costruiscono subito
    branches: [main]
    paths:
      - "wiki-studio/normativa/codici.json"
      - ".github/workflows/settimanale.yml"     # strumenti nuovi: si provano subito
  workflow_dispatch:
    inputs:
      forza:
        description: "riscarica tutti gli atti"
        type: boolean
        default: false
      solo:
        description: "solo questi atti (slug separati da spazio)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: cartelle di lavoro fuori dal repo
        run: |
          echo "STUDIO_STATO_ROOT=$RUNNER_TEMP/stato" >> "$GITHUB_ENV"
          echo "STUDIO_CORPUS=$RUNNER_TEMP/corpus-vivo" >> "$GITHUB_ENV"
      - name: normattiva risponde?
        run: python3 scripts/corpus_pubblica.py --sonda
      - name: giro settimanale del corpus
        run: |
          ARGS="--settimanale --report $RUNNER_TEMP/rapporto.md"
          if [ "${{ inputs.forza }}" = "true" ]; then ARGS="$ARGS --forza"; fi
          for s in ${{ inputs.solo }}; do ARGS="$ARGS --solo $s"; done
          python3 scripts/corpus_pubblica.py $ARGS 2> >(tee $RUNNER_TEMP/giro.err >&2)
      - name: estremi della Cassazione (anno in corso e precedente; se SentenzeWeb non risponde, avviso e si salta)
        continue-on-error: true
        run: python3 scripts/cassazione_indice.py --aggiorna --report $RUNNER_TEMP/cassazione.md
      - name: manifest finale e verifica
        run: |
          set -o pipefail
          python3 scripts/corpus_pubblica.py --manifest && python3 scripts/corpus_pubblica.py --verifica | tee $RUNNER_TEMP/verifica.txt
      - name: pubblica
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add -A
          git commit -m "corpus $(date -u +%F)" || echo "nessuna modifica"
          # fonti di secondo livello caricate durante il giro: file diversi, nessun conflitto; il manifest si
          # rifa' dopo il rebase, cosi' le comprende (e conserva le date di verifica di questa settimana)
          git pull --rebase origin main
          python3 scripts/corpus_pubblica.py --manifest && python3 scripts/corpus_pubblica.py --verifica
          git add -A
          git commit -m "manifest $(date -u +%F)" || echo "manifest invariato"
          git push
      - name: rapporto
        if: always()
        run: |
          cat $RUNNER_TEMP/rapporto.md $RUNNER_TEMP/cassazione.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          # i log e il riepilogo di un'Action si leggono solo da autenticati: gli esiti negativi diventano annotazioni,
          # che l'API pubblica mostra a chiunque (le legge anche il plugin per la diagnosi)
          grep -h -E "❌|⚠️" $RUNNER_TEMP/rapporto.md 2>/dev/null | head -20 | sed 's/^- */::warning::/' || true
          grep -v "^verifica: OK" $RUNNER_TEMP/verifica.txt 2>/dev/null | head -10 | sed 's/^ */::error::/' || true
          tail -n 8 $RUNNER_TEMP/giro.err 2>/dev/null | sed 's/^/::error::/' || true
