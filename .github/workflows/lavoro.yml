name: lavoro (CCNL, prassi, memento)

on:
  workflow_run:
    workflows: ["corpus settimanale", "richiesta lavoro"]
    types: [completed]
  schedule:
    - cron: "41 5 * * 2"          # martedi' 07:41 ora italiana: riserva se il giro del lunedi' non e' partito
  workflow_dispatch:
    inputs:
      a_secco:
        description: "solo indici e triage, senza Claude"
        type: boolean
        default: false
      schede:
        description: "schede da rivedere (id separati da spazio)"
        type: string
        default: ""
      crea:
        description: "schede da creare (id separati da spazio)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  lavoro:
    runs-on: ubuntu-24.04           # non ubuntu-latest: su Ubuntu 26 (dal 19/10/2026) Python 3.9 non c'e'
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: cartelle di lavoro fuori dal repo
        run: |
          echo "STUDIO_STATO_ROOT=$RUNNER_TEMP/stato" >> "$GITHUB_ENV"
          echo "STUDIO_CORPUS=$RUNNER_TEMP/corpus-vivo" >> "$GITHUB_ENV"
      - name: indice dei contratti collettivi (archivio CNEL)
        continue-on-error: true
        run: python3 scripts/ccnl_indice.py --aggiorna --report $RUNNER_TEMP/lavoro.md
      - name: indice della prassi (INPS, INL, Ministero del lavoro, INAIL)
        continue-on-error: true
        run: python3 scripts/prassi_indice.py --aggiorna --report $RUNNER_TEMP/lavoro.md
      - name: numeri annuali calcolati
        continue-on-error: true
        run: python3 scripts/dati_lavoro.py --calcola --report $RUNNER_TEMP/lavoro.md
      - name: triage del memento
        id: triage
        env:
          SCHEDE: ${{ inputs.schede }}
          CREA: ${{ inputs.crea }}
        run: >-
          python3 scripts/memento_triage.py --triage $RUNNER_TEMP/triage.json --schede "$SCHEDE" --crea "$CREA"
          --github-output "$GITHUB_OUTPUT" --report $RUNNER_TEMP/lavoro.md
      - name: indici e triage fissati (commit locale prima del modello, cosi' il controllo vede solo le sue modifiche)
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add -A wiki-studio/lavoro
          git commit -m "lavoro: indici $(date -u +%F)" || echo "indici invariati"
      - name: Claude aggiorna le schede toccate
        id: claude
        if: steps.triage.outputs.lavoro == 'true' && inputs.a_secco != true
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBAGENT_MODEL: opus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Segui le istruzioni di .github/claude/memento-regole.md.
            Il lavoro da fare e' in ${{ runner.temp }}/triage.json.
            Alla fine scrivi gli esiti in ${{ runner.temp }}/esiti-claude.json.
          claude_args: >-
            --model opus
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(python3 scripts/memento_verifica.py:*),Bash(python3 scripts/dati_lavoro.py:*),Bash(python3 scripts/prassi_indice.py:*),Bash(python3 scripts/codice_locale.py:*)"
      - name: controllo meccanico
        id: controllo
        if: always()
        run: >-
          python3 scripts/memento_verifica.py --dopo-claude --triage $RUNNER_TEMP/triage.json
          --esiti $RUNNER_TEMP/esiti-claude.json --github-output "$GITHUB_OUTPUT"
          --issue $RUNNER_TEMP/issue.md --report $RUNNER_TEMP/lavoro.md
      - name: pubblica
        if: always()
        run: |
          python3 scripts/corpus_pubblica.py --manifest && python3 scripts/corpus_pubblica.py --verifica
          git add -A wiki-studio/lavoro manifest.json
          git commit -m "lavoro $(date -u +%F)" || echo "nessuna modifica"
          git pull --rebase origin main
          python3 scripts/corpus_pubblica.py --manifest && python3 scripts/corpus_pubblica.py --verifica
          git add -A wiki-studio/lavoro manifest.json
          git commit -m "manifest $(date -u +%F)" || echo "manifest invariato"
          git push
      - name: segnalazione
        if: always() && inputs.a_secco != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBLEMI: ${{ steps.controllo.outputs.problemi }}
          CLAUDE_KO: ${{ steps.claude.outcome == 'failure' }}
        run: |
          gh label create memento --color 0E8A16 --description "schede del memento da rivedere" --force || true
          # una issue sola: si aggiorna la piu' recente, le altre si chiudono; nessun problema = tutte chiuse
          # (problemi = schede respinte + schede del triage non riviste + file ripristinati: memento_verifica.py)
          OGGI=$(date -u +%F)
          PREFISSO="memento: schede da rivedere"
          CORPO=$RUNNER_TEMP/issue.md
          APERTE=$(gh issue list --label memento --state open --limit 200 --json number,title --jq "[.[] | select(.title | startswith(\"$PREFISSO\"))] | sort_by(.number) | reverse | .[].number" || true)
          if [ "$CLAUDE_KO" != "true" ] && [ -z "$PROBLEMI" ]; then
            echo "::warning::controllo meccanico del memento senza esito: issue lasciate come sono"
            exit 0
          fi
          if [ "$CLAUDE_KO" != "true" ] && [ "$PROBLEMI" = "0" ]; then
            for N in $APERTE; do gh issue close "$N" --comment "memento senza schede da rivedere ($OGGI)" || true; done
            exit 0
          fi
          [ -s "$CORPO" ] || echo "Il controllo meccanico del memento ha trovato $PROBLEMI problemi: vedi il rapporto del giro." > "$CORPO"
          if [ "$CLAUDE_KO" = "true" ]; then
            { echo "Il passo Claude non e' riuscito (token scaduto o quota esaurita?): le schede da rivedere restano marcate da_ricontrollare."; echo; cat "$CORPO"; } > "$CORPO.tmp" && mv "$CORPO.tmp" "$CORPO"
          fi
          printf '\n_Aggiornata dal giro del %s: %s/%s/actions/runs/%s_\n' "$OGGI" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$CORPO"
          ULTIMA=$(echo "$APERTE" | head -n 1)
          if [ -n "$ULTIMA" ]; then
            gh issue edit "$ULTIMA" --title "$PREFISSO ($OGGI)" --body-file "$CORPO" || true
          else
            ULTIMA=$(gh issue create --title "$PREFISSO ($OGGI)" --label memento --body-file "$CORPO" | grep -oE '[0-9]+$' || true)
          fi
          for N in $APERTE; do [ "$N" = "$ULTIMA" ] || gh issue close "$N" --comment "superata dalla #$ULTIMA" || true; done
      - name: rapporto
        if: always()
        run: |
          cat $RUNNER_TEMP/lavoro.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          # il riepilogo si legge solo da autenticati: gli esiti negativi diventano annotazioni pubbliche
          grep -h -E "❌|⚠️" $RUNNER_TEMP/lavoro.md 2>/dev/null | head -20 | sed 's/^- */::warning::/' || true
          python3 scripts/corpus_pubblica.py --verifica 2>&1 | grep -v "^verifica: OK" | head -10 | sed 's/^ */::warning::/' || true
